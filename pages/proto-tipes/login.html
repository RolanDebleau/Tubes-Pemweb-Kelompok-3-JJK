<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Document</title>
    <style>
        .container {
            width: 100vw;
            height: 100vh;
            background-image: url(../../asset/guest_bg.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-color: rgba(0, 0, 0, 0.5);
            background-blend-mode: darken;
        }
        header {
            width: 100%;
            height: 10rem;
            display: flex;
            justify-content: end;
            background-color: red;
        }
        nav {
            width: 50rem;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        nav ul {
            width: fit-content;
            display: flex;
            background-color: #aaa;
            borderrad: 35px;
        }
        nav li {
            font-size: 2rem;
            font-weight: 600;
            list-style: none;
            text-align: center;
            padding: 1rem 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <ul>
                    <li style="color: #fff; background: #0613A6; border-radius: 35px;">Login</li>
                    <li style="color: #000;">Register</li>
                </ul>
            </nav>
        </header>
    </div>
</body>
</html>
